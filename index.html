<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101310"><link rel="manifest" href="manifest.json">
<title>Relic of Emberwood</title>
<style>
html,body{margin:0;height:100%;background:#101310;color:#eee;font-family:system-ui,sans-serif;touch-action:none;overscroll-behavior:none}body{display:flex;align-items:center;justify-content:center}#wrap{width:min(96vw,680px)}#hud{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:13px;margin:4px}canvas{width:100%;aspect-ratio:256/240;image-rendering:pixelated;background:#000;border:3px solid #454945;border-radius:5px;display:block}#controls{display:flex;justify-content:space-between;align-items:center;padding:7px;user-select:none;-webkit-user-select:none}#stick{width:145px;height:145px;border-radius:50%;background:#262a26;position:relative;box-shadow:inset 0 0 0 3px #454;touch-action:none}#knob{width:60px;height:60px;border-radius:50%;background:#596159;position:absolute;left:42px;top:42px;pointer-events:none;box-shadow:inset 0 -5px #414941}.actions{display:flex;gap:12px}.actions button{width:72px;height:72px;border:0;border-radius:50%;font-size:22px;font-weight:900;color:#fff;background:#802f2f;touch-action:none}.actions .b{background:#343b86}.center{display:flex;flex-direction:column;gap:7px}.center button{border:0;border-radius:16px;padding:8px 12px;background:#343a35;color:#fff;font-weight:800;font-size:11px}.help{text-align:center;font-size:11px;opacity:.78;min-height:16px}@media(max-width:470px){#stick{width:124px;height:124px}#knob{left:32px;top:32px}.actions button{width:62px;height:62px}.center button{padding:7px 9px}}
</style>
</head>
<body><div id="wrap"><div id="hud"><span id="name"></span><span id="stats"></span></div><canvas id="game" width="256" height="240"></canvas><div id="controls"><div id="stick"><div id="knob"></div></div><div class="center"><button id="mapBtn">MAP</button><button id="itemBtn">ITEM: BOMB</button><button id="newBtn">NEW</button></div><div class="actions"><button class="b" data-key="KeyB">B</button><button data-key="Space">A</button></div></div><div class="help" id="help">360° move · A sword · B bomb · MAP pauses · ITEM cycles B-tool · enemies return after travel · gamepads supported · autosaves</div></div>
<script src="core.js"></script><script src="state.js"></script><script src="render.js"></script></body></html>

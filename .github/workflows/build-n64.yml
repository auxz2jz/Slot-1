name: Build Relic of Emberwood N64 ROM

on:
  push:
    branches: [main]
    paths:
      - 'n64/**'
      - '.github/workflows/build-n64.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emberwood
        uses: actions/checkout@v6

      - name: Pull official libdragon toolchain image
        run: docker pull ghcr.io/dragonminded/libdragon:latest

      - name: Build preview libdragon, Tiny3D, and ROM
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/dragonminded/libdragon:latest \
            bash -lc '
              set -euxo pipefail
              git clone --depth 1 --branch preview https://github.com/DragonMinded/libdragon.git /tmp/libdragon
              cd /tmp/libdragon
              ./build.sh --no-examples
              git clone --depth 1 https://github.com/HailToDodongo/tiny3d.git /tmp/tiny3d
              cd /tmp/tiny3d
              make -j4
              make install
              cd /work/n64
              # Temporary compile probe: current libdragon RGBA32 returns color_t,
              # while Tiny3D packed vertices store raw 0xRRGGBBAA values.
              sed -i \
                -e "s/RGBA32(75, 118, 58, 255)/0x4B763AFFu/" \
                -e "s/RGBA32(151, 119, 76, 255)/0x97774CFFu/" \
                -e "s/RGBA32(54, 111, 55, 255)/0x366F37FFu/" \
                -e "s/RGBA32(34, 74, 39, 255)/0x224A27FFu/" \
                -e "s/RGBA32(224, 166, 112, 255)/0xE0A670FFu/" \
                -e "s/RGBA32(126, 76, 35, 255)/0x7E4C23FFu/" \
                -e "s/RGBA32(110, 70, 39, 255)/0x6E4627FFu/" \
                -e "s/RGBA32(67, 42, 28, 255)/0x432A1CFFu/" \
                -e "s/RGBA32(201, 201, 184, 255)/0xC9C9B8FFu/" \
                -e "s/RGBA32(189, 155, 75, 255)/0xBD9B4BFFu/" \
                -e "s/RGBA32(135, 57, 48, 255)/0x873930FFu/" \
                src/main.c
              make T3D_INST=/tmp/tiny3d
            '

      - name: Verify ROM
        run: |
          test -s n64/relic_emberwood.z64
          file n64/relic_emberwood.z64
          sha256sum n64/relic_emberwood.z64

      - name: Upload emulator-ready ROM
        uses: actions/upload-artifact@v4
        with:
          name: Relic-of-Emberwood-N64
          path: n64/relic_emberwood.z64
          if-no-files-found: error
          retention-days: 30
